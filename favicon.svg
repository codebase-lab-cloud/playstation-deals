<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="psBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0070D1"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="psBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <g transform="translate(256, 256) scale(1.08)">
    <!-- PlayStation Shapes (Triangle, Circle, Cross, Square) -->
    <!-- Triangle (Top-Left) -->
    <path d="M -110 -150 L -60 -65 L -160 -65 Z" fill="none" stroke="#22d3ee" stroke-width="20" stroke-linejoin="round"/>
    <!-- Circle (Top-Right) -->
    <circle cx="110" cy="-105" r="48" fill="none" stroke="#f43f5e" stroke-width="20"/>
    <!-- Cross (Bottom-Left) -->
    <g transform="translate(-110, 105)">
      <line x1="-38" y1="-38" x2="38" y2="38" stroke="#3b82f6" stroke-width="20" stroke-linecap="round"/>
      <line x1="38" y1="-38" x2="-38" y2="38" stroke="#3b82f6" stroke-width="20" stroke-linecap="round"/>
    </g>
    <!-- Square (Bottom-Right) -->
    <rect x="65" y="60" width="90" height="90" rx="14" fill="none" stroke="#ec4899" stroke-width="20"/>
    <!-- Center Dynamic Lightning Deal Bolt -->
    <polygon points="25,-175 -85,15 15,15 -25,175 85,-15 -15,-15" fill="url(#psBolt)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  </g>
